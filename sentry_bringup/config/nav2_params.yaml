# ===== 1. AMCL 定位 =====
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic_name: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    set_initial_pose: true
    initial_pose: [0.0, 0.0, 0.0]
    transform_tolerance: 0.2
    update_min_d: 0.1                     # 移动 0.1m 才更新粒子
    update_min_a: 0.1                     # 旋转 0.1rad 才更新粒子
    resample_interval: 1
    particle:
      min_particles: 500
      max_particles: 2000
    laser_model_type: likelihood_field
    laser_max_range: 20.0
    laser_min_range: 0.38
    laser_likelihood_max_dist: 2.0

# ===== 2. 地图服务器 =====
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""                     # launch 时通过参数传入

# ===== 3. 行为树导航器 =====
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link_fake
    # 必须是 /Odometry_world_fixed：Nav2 不变换 odom twist，直接当作
    # robot_base_frame(base_link_fake) 中的当前速度。/Odometry 的 twist 在随车体
    # 转动的 base_link 中，两者相差一个车体 yaw，用错会自旋时跑偏。
    odom_topic: /Odometry_world_fixed
    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

# ===== 4. 控制器 DWB =====
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    robot_base_frame: base_link_fake
    # 同上：twist 已在 base_link_fake 轴系，DWB 的可达速度窗口才不会锚错方向。
    odom_topic: /Odometry_world_fixed
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.14159
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: -2.0
      max_vel_x: 3.0
      min_vel_y: -2.0
      max_vel_y: 3.0
      max_vel_theta: 0.0
      min_speed_xy: 0.0
      max_speed_xy: 4.24
      min_speed_theta: 0.0
      acc_lim_x: 1.5
      acc_lim_y: 1.5
      acc_lim_theta: 0.0
      critics: ["Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0

# ===== 5. 全局规划器 SMAC 2D =====
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      cost_travel_weight: 0.55
      angle_quantization_bins: 64
      analytic_expansion_ratio: 3.0
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.0
      reverse_penalty: 2.0
      smooth_path: false

# ===== 6. 路径平滑器 =====
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      w_data: 0.2
      w_smooth: 0.4
      do_refinement: true

# ===== 7. 行为服务器 =====
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint: "[[-0.27, -0.27], [-0.27, 0.27], [0.27, 0.27], [0.27, -0.27]]"
    robot_base_frame: base_link_fake
    transform_tolerance: 0.2
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    cycle_frequency: 10.0
    plugins: ["spin", "backup", "wait"]

# ===== 8. 速度平滑器 =====
# 作用：以固定 20Hz 持续发布 /cmd_vel_nav_smoothed。控制器空闲 / abort / 恢复时
# 也会继续发 0，避免下游 fake_vel_transform 静默 —— 否则 ros2_comm 0.3s 后打
# "/cmd_vel timeout, sending zero velocity"。
# 限幅必须对齐 DWB：y 不能为 0（否则全向退化成差速），x 要覆盖 DWB 的 [-2, 3]。
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true            # 超限等比缩放；逐轴裁剪会改变速度方向导致跑偏
    feedback: OPEN_LOOP
    max_velocity: [3.0, 3.0, 0.0]
    min_velocity: [-2.0, -2.0, 0.0]
    max_accel: [1.5, 1.5, 0.0]
    max_decel: [-1.5, -1.5, 0.0]
    odom_topic: /Odometry_world_fixed
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]    # 别把 0.3 以下的小速度吃掉
    velocity_timeout: 0.5

# ===== 9. 局部代价地图 =====
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 5.0
      global_frame: odom
      robot_base_frame: base_link_fake
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.30
      footprint_padding: 0.02
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.15
        cost_scaling_factor: 3.0

# ===== 10. 全局代价地图 =====
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 0.5
      transform_tolerance: 5.0
      global_frame: map
      robot_base_frame: base_link_fake
      rolling_window: false
      resolution: 0.05
      robot_radius: 0.25
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.20
        cost_scaling_factor: 3.0

# ===== 11. 航点跟随器 =====
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false